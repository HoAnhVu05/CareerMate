server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: PT60S
      routes:
        # User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/auth/**, /api/students/**, /api/recruiters/**, /api/messaging/**, /api/uploads/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service
        
        # User Service WebSocket
        - id: user-service-ws
          uri: lb:ws://user-service
          predicates:
            - Path=/ws/**
        
        # Job Service
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**, /api/applications/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker
                fallbackUri: forward:/fallback/job-service
        
        # Content Service
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/articles/**, /api/companies/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: contentServiceCircuitBreaker
                fallbackUri: forward:/fallback/content-service
        
        # Learning Service
        - id: learning-service
          uri: lb://learning-service
          predicates:
            - Path=/api/courses/**, /api/challenges/**, /api/cv-templates/**, /api/packages/**, /api/course-content/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: learningServiceCircuitBreaker
                fallbackUri: forward:/fallback/learning-service
        
        # Admin Service
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: adminServiceCircuitBreaker
                fallbackUri: forward:/fallback/admin-service
        
        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /api/messages/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service
        
        # AI Service
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**, /api/career-roadmap/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: aiServiceCircuitBreaker
                fallbackUri: forward:/fallback/ai-service

        # Swagger Routes for Microservices
        - id: user-service-swagger
          uri: lb://user-service
          predicates:
            - Path=/api/user-service/v3/api-docs
          filters:
            - RewritePath=/api/user-service/v3/api-docs, /v3/api-docs
        - id: job-service-swagger
          uri: lb://job-service
          predicates:
            - Path=/api/job-service/v3/api-docs
          filters:
            - RewritePath=/api/job-service/v3/api-docs, /v3/api-docs
        - id: content-service-swagger
          uri: lb://content-service
          predicates:
            - Path=/api/content-service/v3/api-docs
          filters:
            - RewritePath=/api/content-service/v3/api-docs, /v3/api-docs
        - id: learning-service-swagger
          uri: lb://learning-service
          predicates:
            - Path=/api/learning-service/v3/api-docs
          filters:
            - RewritePath=/api/learning-service/v3/api-docs, /v3/api-docs
        - id: admin-service-swagger
          uri: lb://admin-service
          predicates:
            - Path=/api/admin-service/v3/api-docs
          filters:
            - RewritePath=/api/admin-service/v3/api-docs, /v3/api-docs
        - id: notification-service-swagger
          uri: lb://notification-service
          predicates:
            - Path=/api/notification-service/v3/api-docs
          filters:
            - RewritePath=/api/notification-service/v3/api-docs, /v3/api-docs
        - id: ai-service-swagger
          uri: lb://ai-service
          predicates:
            - Path=/api/ai-service/v3/api-docs
          filters:
            - RewritePath=/api/ai-service/v3/api-docs, /v3/api-docs

      # Disable Spring Cloud Gateway's default CORS handling
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: []
            allowedMethods: []
            allowedHeaders: []
            allowCredentials: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 1. User Service
        url: /api/user-service/v3/api-docs
      - name: 2. Job Service
        url: /api/job-service/v3/api-docs
      - name: 3. AI Service
        url: /api/ai-service/v3/api-docs
      - name: 4. Learning Service
        url: /api/learning-service/v3/api-docs
      - name: 5. Content Service
        url: /api/content-service/v3/api-docs
      - name: 6. Notification Service
        url: /api/notification-service/v3/api-docs
      - name: 7. Admin Service
        url: /api/admin-service/v3/api-docs

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 60s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
